<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lights">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>LED</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g'><stop offset='0' stop-color='%23ff4d8d'/><stop offset='1' stop-color='%234dc3ff'/></linearGradient></defs><circle cx='16' cy='16' r='13' fill='url(%23g)'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" id="glow"></div>

  <main class="app">
    <header>
      <h1>Lights</h1>
      <button class="power" id="power" aria-label="Toggle power" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
        </svg>
      </button>
    </header>

    <section class="strip-preview" id="strip-preview" hidden>
      <div class="strip" id="strip"></div>
      <p class="hint">Virtual strip: mock mode, no hardware connected</p>
    </section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="static" class="active">Color</button>
      <button role="tab" data-tab="fade">Fade</button>
      <button role="tab" data-tab="rainbow">Rainbow</button>
      <button role="tab" data-tab="effects">Effects</button>
    </nav>

    <section class="card panel" id="panel-static">
      <div class="wheel-wrap" id="wheel-wrap">
        <canvas id="wheel"></canvas>
        <div class="cursor" id="cursor"></div>
      </div>
      <label class="slider-label">Brightness <span id="brightness-val"></span></label>
      <input type="range" id="brightness" min="0" max="100" value="100">
      <div class="current">
        <span class="swatch big" id="current-swatch"></span>
        <code id="current-hex">#000000</code>
        <button class="ghost" id="save-fav">♥ Save</button>
      </div>
    </section>

    <section class="card panel" id="panel-fade" hidden>
      <p class="hint">Ease back and forth between two colors.</p>
      <div class="pair">
        <label class="color-input"><input type="color" id="fade-a" value="#ff2d78"><span>From</span></label>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <label class="color-input"><input type="color" id="fade-b" value="#2dc8ff"><span>To</span></label>
      </div>
      <label class="slider-label">Speed <span id="fade-period-val"></span></label>
      <input type="range" id="fade-period" min="1" max="60" value="4">
      <button class="primary" id="fade-go">Start fade</button>
    </section>

    <section class="card panel" id="panel-rainbow" hidden>
      <p class="hint">Cycle smoothly through every hue.</p>
      <div class="rainbow-bar"></div>
      <label class="slider-label">Cycle time <span id="rainbow-period-val"></span></label>
      <input type="range" id="rainbow-period" min="2" max="120" value="20">
      <button class="primary" id="rainbow-go">Start rainbow</button>
    </section>

    <section class="card panel" id="panel-effects" hidden>
      <button class="effect" data-effect="candle">
        <span class="effect-icon candle-icon" aria-hidden="true"></span>
        <span class="effect-text"><strong>Candle</strong><small>Warm, softly flickering flame</small></span>
      </button>
      <button class="effect" data-effect="aurora">
        <span class="effect-icon aurora-icon" aria-hidden="true"></span>
        <span class="effect-text"><strong>Aurora</strong><small>Slowly drifting northern lights</small></span>
      </button>
      <button class="effect" data-effect="lavalamp">
        <span class="effect-icon lavalamp-icon" aria-hidden="true"></span>
        <span class="effect-text"><strong>Lava lamp</strong><small>Slow drifting blobs of warm color</small></span>
      </button>
      <button class="effect" data-effect="thunderstorm">
        <span class="effect-icon thunderstorm-icon" aria-hidden="true"></span>
        <span class="effect-text"><strong>Thunderstorm</strong><small>Dark clouds, distant lightning</small></span>
      </button>
      <div class="effect-group">
        <button class="effect" data-effect="cyberpunk">
          <span class="effect-icon cyberpunk-icon" aria-hidden="true"></span>
          <span class="effect-text"><strong>Cyberpunk</strong><small>Neon with random glitches</small></span>
        </button>
        <div class="effect-controls" id="cyberpunk-controls" hidden>
          <label class="switch">
            <span>Glitches</span>
            <input type="checkbox" id="cyberpunk-glitch" checked>
            <i aria-hidden="true"></i>
          </label>
        </div>
      </div>
      <button class="effect" data-effect="backrooms">
        <span class="effect-icon backrooms-icon" aria-hidden="true"></span>
        <span class="effect-text"><strong>Backrooms</strong><small>Harsh, buzzing fluorescent tubes</small></span>
      </button>
      <div class="effect-group">
        <button class="effect" data-effect="caramelldansen">
          <span class="effect-icon caramell-icon" aria-hidden="true"></span>
          <span class="effect-text"><strong>Caramelldansen</strong><small>Candy colors on the beat</small></span>
        </button>
        <div class="effect-controls" id="caramelldansen-controls" hidden>
          <label class="slider-label">Tempo <span id="caramell-bpm-val"></span></label>
          <input type="range" id="caramell-bpm" min="120" max="200" value="165">
        </div>
      </div>
      <div class="effect-group">
        <button class="effect" data-effect="strobe">
          <span class="effect-icon strobe-icon" aria-hidden="true"></span>
          <span class="effect-text"><strong>Strobe</strong><small>Fast white flashes</small></span>
        </button>
        <div class="effect-controls" id="strobe-controls" hidden>
          <label class="slider-label">Speed <span id="strobe-rate-val"></span></label>
          <input type="range" id="strobe-rate" min="1" max="10" value="4">
        </div>
      </div>
      <div class="effect-group">
        <button class="effect" data-effect="pigs">
          <span class="effect-icon pigs-icon" aria-hidden="true"></span>
          <span class="effect-text"><strong>Pigs</strong><small>Alternating red and blue flashes</small></span>
        </button>
        <div class="effect-controls" id="pigs-controls" hidden>
          <button type="button" class="flag-toggle" id="pigs-norway" aria-pressed="false" aria-label="Norway mode: blue lights only" title="Norway mode: blue lights only">🇳🇴</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Favorites</h2>
        <button class="ghost" id="edit-favs">Edit</button>
      </div>
      <div class="favs" id="favs"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
